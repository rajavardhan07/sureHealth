<div class="fade-in-up">
  <div class="page-header">
    <h1>Underwriters</h1>
    <p>Create new underwriter accounts</p>
  </div>

  <mat-card class="form-card">
    <h3>Create Underwriter</h3>
    <form [formGroup]="form" (ngSubmit)="create()" class="officer-form">
      <mat-form-field appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" placeholder="e.g. Robert Brown">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="e.g. robert.brown">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password">
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid" class="submit-btn">
        <mat-icon>person_add</mat-icon> Create Underwriter
      </button>
    </form>

    @if (createdUser) {
      <div class="success-card">
        <mat-icon>check_circle</mat-icon>
        <div>
          <strong>Underwriter Created Successfully</strong>
          <p>Username: {{ createdUser.username }}</p>
        </div>
      </div>
    }
  </mat-card>
</div>
