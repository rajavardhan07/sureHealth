<div class="h-screen flex overflow-hidden bg-[#F8F6F1] font-sans">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-[#E2E6EC] flex flex-col transition-all duration-300">
    <div class="h-20 flex items-center px-6 border-b border-[#E2E6EC]">
      <div class="flex items-center gap-3">
        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#C8A951"/>
          <path d="M14 34V14h6v8h8v-8h6v20h-6v-8h-8v8h-6z" fill="#1B2A4A"/>
        </svg>
        <div class="flex flex-col">
          <span class="text-[#1B2A4A] font-bold text-lg leading-tight tracking-tight">SureHealth</span>
          <span class="text-xs font-semibold text-[#C8A951] uppercase tracking-wider">Claims Officer</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      <a routerLink="/claims-officer/dashboard" routerLinkActive="bg-[#F5EDD8] text-[#9A7D2C] font-semibold border-r-4 border-[#C8A951] bg-opacity-70"
         class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-[#5A6A7E] hover:bg-[#F8F6F1] hover:text-[#1B2A4A] transition-colors group">
        <mat-icon class="mr-3 h-[20px] w-[20px] leading-none group-hover:text-[#1B2A4A]">dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      
      <a routerLink="/claims-officer/queue" routerLinkActive="bg-[#F5EDD8] text-[#9A7D2C] font-semibold border-r-4 border-[#C8A951] bg-opacity-70"
         class="flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-[#5A6A7E] hover:bg-[#F8F6F1] hover:text-[#1B2A4A] transition-colors group">
        <mat-icon class="mr-3 h-[20px] w-[20px] leading-none group-hover:text-[#1B2A4A]">fact_check</mat-icon>
        <span>Review Queue</span>
      </a>
    </nav>

    <div class="p-4 border-t border-[#E2E6EC]">
      <button (click)="logout()" 
        class="flex w-full items-center px-3 py-2.5 text-sm font-medium rounded-lg text-red-600 hover:bg-red-50 transition-colors">
        <mat-icon class="mr-3 h-[20px] w-[20px] leading-none">logout</mat-icon>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <header class="h-20 bg-white border-b border-[#E2E6EC] flex items-center justify-between px-8 z-10 shadow-sm">
      <div>
        <h2 class="text-2xl font-bold text-[#1B2A4A]">Claims Officer Portal</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3 pl-4 border-l border-[#E2E6EC]">
          <div class="flex flex-col text-right">
            <span class="text-sm font-bold text-[#1B2A4A]">{{ authService.getUsername() }}</span>
            <span class="text-xs text-[#5A6A7E]">Claims Officer</span>
          </div>
          <div class="h-10 w-10 rounded-full bg-[#E8EFF8] text-[#2E5C9A] flex items-center justify-center font-bold text-lg border-2 border-white shadow-sm ring-2 ring-[#F0F2F5]">
            {{ getInitial() }}
          </div>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-8">
      <div class="max-w-[1400px] mx-auto">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
