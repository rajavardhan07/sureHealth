<div class="fade-in-up">
      <div class="page-header">
        <h1>File a Claim</h1>
        <p>Submit a new insurance claim for medical expenses</p>
      </div>

      <mat-card class="form-card">
        <form [formGroup]="form" (ngSubmit)="submit()">
          <h3>Medical Details</h3>
          <div class="form-grid">
            <mat-form-field appearance="outline">
              <mat-label>Hospital Name</mat-label>
              <input matInput formControlName="hospitalName" placeholder="Hospital name">
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Diagnosis</mat-label>
              <input matInput formControlName="diagnosis" placeholder="Diagnosis details">
            </mat-form-field>
          </div>

          <h3>Billing Details</h3>
          <div class="form-grid">
            <mat-form-field appearance="outline">
              <mat-label>Bill Amount (₹)</mat-label>
              <input matInput type="number" formControlName="billAmount" placeholder="Amount in ₹">
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Bill Number</mat-label>
              <input matInput formControlName="billNumber" placeholder="Bill reference">
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Treatment Date</mat-label>
              <input matInput [matDatepicker]="picker" formControlName="treatmentDate">
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>

          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid" class="submit-btn">
            <mat-icon>send</mat-icon> Submit Claim
          </button>
        </form>
      </mat-card>
    </div>
