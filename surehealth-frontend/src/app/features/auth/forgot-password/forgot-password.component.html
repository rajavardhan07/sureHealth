<div class="min-h-screen bg-[#F8FAFC] flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-[#2E5C9A]/10 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-key text-[#2E5C9A] text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-[#1B2A4A]">Reset Password</h2>
      <p class="text-[#5A6A7E] mt-2">
        @if (step() === 1) {
          Enter your username to receive a reset code.
        } @else {
          Enter the 6-digit code sent to you and choose a new password.
        }
      </p>
    </div>

    @if (step() === 1) {
      <form (submit)="onRequestReset()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-[#5A6A7E] mb-2">Username</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
              <i class="fas fa-user"></i>
            </span>
            <input 
              type="text" 
              name="username"
              [(ngModel)]="username"
              required
              placeholder="Enter your username"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:border-[#2E5C9A] focus:ring-2 focus:ring-[#2E5C9A]/20 transition-all outline-none"
            >
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loading() || !username"
          class="w-full bg-[#2E5C9A] text-white py-3 rounded-xl font-semibold shadow-lg shadow-[#2E5C9A]/20 hover:bg-[#1B2A4A] transition-all flex items-center justify-center gap-2 disabled:opacity-50"
        >
          @if (loading()) {
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          }
          Send Reset Code
        </button>
      </form>
    } @else {
      <form (submit)="onResetPassword()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-[#5A6A7E] mb-2">6-Digit Reset Code</label>
          <input 
            type="text" 
            name="token"
            [(ngModel)]="token"
            required
            maxlength="6"
            placeholder="000000"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#2E5C9A] focus:ring-2 focus:ring-[#2E5C9A]/20 transition-all outline-none text-center text-2xl font-mono tracking-widest"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-[#5A6A7E] mb-2">New Password</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
              <i class="fas fa-lock"></i>
            </span>
            <input 
              type="password" 
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              placeholder="••••••••"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:border-[#2E5C9A] focus:ring-2 focus:ring-[#2E5C9A]/20 transition-all outline-none"
            >
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loading() || !token || !newPassword"
          class="w-full bg-[#2E5C9A] text-white py-3 rounded-xl font-semibold shadow-lg shadow-[#2E5C9A]/20 hover:bg-[#1B2A4A] transition-all flex items-center justify-center gap-2 disabled:opacity-50"
        >
          @if (loading()) {
            <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          }
          Reset Password
        </button>
      </form>
    }

    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <a routerLink="/login" class="text-[#2E5C9A] font-medium hover:underline flex items-center justify-center gap-2">
        <i class="fas fa-arrow-left text-xs"></i>
        Back to Login
      </a>
    </div>
  </div>
</div>
